name: Temp ASR Model Bundle

on:
  pull_request:
    paths:
      - '.github/workflows/temp-asr-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Build whisper.cpp and download multilingual model
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
          git clone --depth 1 --branch v1.8.6 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DWHISPER_CURL=OFF
          cmake --build whisper.cpp/build --config Release -j2
          mkdir -p bundle
          cp whisper.cpp/build/bin/whisper-cli bundle/
          curl -L --fail --retry 5 --retry-all-errors \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin' \
            -o bundle/ggml-small-q5_1.bin
          chmod +x bundle/whisper-cli
          sha256sum bundle/* > bundle/SHA256SUMS.txt
          ls -lh bundle
          ldd bundle/whisper-cli || true
      - name: Upload ASR bundle
        uses: actions/upload-artifact@v4
        with:
          name: temp-whisper-static-bundle
          path: bundle/
          retention-days: 1
